<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120" font-family="'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,4 L1,7" fill="none" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Node 1: 第一步 / 装上体验（浅蓝） -->
  <rect x="10" y="20" width="130" height="70" rx="8" ry="8" fill="#DAEEFB" stroke="#7CB9E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第一步</text>
  <text x="75" y="72" text-anchor="middle" font-size="13" fill="#555">装上体验</text>

  <!-- Arrow 1 -->
  <line x1="140" y1="55" x2="175" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2: 第二步 / 写HelloWorld（粉红） -->
  <rect x="185" y="20" width="150" height="70" rx="8" ry="8" fill="#FCE4EC" stroke="#F48FB1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第二步</text>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#555">写HelloWorld</text>

  <!-- Arrow 2 -->
  <line x1="335" y1="55" x2="370" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 3: 第三步 / 跑通（橙色） -->
  <rect x="380" y="20" width="120" height="70" rx="8" ry="8" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第三步</text>
  <text x="440" y="72" text-anchor="middle" font-size="13" fill="#555">跑通</text>

  <!-- Arrow 3 -->
  <line x1="500" y1="55" x2="535" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4: 第四步 / 对照真实项目（浅绿） -->
  <rect x="545" y="20" width="160" height="70" rx="8" ry="8" fill="#E8F5E9" stroke="#81C784" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">第四步</text>
  <text x="625" y="72" text-anchor="middle" font-size="13" fill="#555">对照真实项目</text>

  <!-- Arrow 4 -->
  <line x1="705" y1="55" x2="740" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 5: 真正接管工具（浅蓝，与第一步呼应） -->
  <rect x="750" y="20" width="100" height="70" rx="8" ry="8" fill="#DAEEFB" stroke="#7CB9E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">真正接管工具</text>
</svg>
