<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7A90"/>
    </marker>
  </defs>

  <style>
    .box { stroke-width: 1.5; }
    .name { font: bold 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2C3A4B; text-anchor: middle; }
    .desc { font: 12.5px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5A6B7E; text-anchor: middle; }
    .leg { font: 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2C3A4B; text-anchor: middle; }
    .edge { stroke: #6B7A90; stroke-width: 1.6; fill: none; }
  </style>

  <!-- 8 条向下的箭头 -->
  <line class="edge" x1="470" y1="84"  x2="470" y2="124" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="208" x2="470" y2="240" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="304" x2="470" y2="336" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="392" x2="470" y2="424" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="488" x2="470" y2="520" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="584" x2="470" y2="616" marker-end="url(#arrow)"/>
  <line class="edge" x1="470" y1="680" x2="470" y2="712" marker-end="url(#arrow)"/>

  <!-- 1. Cron 触发 -->
  <rect class="box" x="330" y="24" width="280" height="60" rx="10" fill="#E0DBF7" stroke="#7E6FCF"/>
  <text class="name" x="470" y="52">Cron 触发</text>
  <text class="desc" x="470" y="72">P0 / P1 / P2 三档自动调度</text>

  <!-- 2. AIAgent + robustmq-chaos-test Skill -->
  <rect class="box" x="330" y="128" width="280" height="80" rx="10" fill="#E0DBF7" stroke="#7E6FCF"/>
  <text class="name" x="470" y="156">AIAgent + robustmq-chaos-test Skill</text>
  <text class="desc" x="470" y="178">收到自然语言 prompt,加载 Skill</text>
  <text class="desc" x="470" y="197">按 Procedure 调 Tool</text>

  <!-- 3. cluster.py -->
  <rect class="box" x="330" y="244" width="280" height="64" rx="10" fill="#FFF3CD" stroke="#D9A441"/>
  <text class="name" x="470" y="270">cluster.py</text>
  <text class="desc" x="470" y="292">spawn 3 个 RobustMQ 进程,等健康</text>

  <!-- 4. chaos.py 注入故障 -->
  <rect class="box" x="330" y="340" width="280" height="64" rx="10" fill="#F8D7DA" stroke="#C97070"/>
  <text class="name" x="470" y="366">chaos.py 注入故障</text>
  <text class="desc" x="470" y="388">调 Chaosd HTTP API</text>

  <!-- 5. client.py 跑 SDK 测试 -->
  <rect class="box" x="330" y="428" width="280" height="64" rx="10" fill="#F8D7DA" stroke="#C97070"/>
  <text class="name" x="470" y="454">client.py 跑 SDK 测试</text>
  <text class="desc" x="470" y="476">用版本管理切换,故障期间只记录</text>

  <!-- 6. chaos 恢复 + client 自愈验证 -->
  <rect class="box" x="330" y="524" width="280" height="64" rx="10" fill="#E8F5E9" stroke="#66A35C"/>
  <text class="name" x="470" y="550">chaos 恢复 + client 自愈验证</text>
  <text class="desc" x="470" y="572">这一步是 pass / fail 的唯一依据</text>

  <!-- 7. report.py -->
  <rect class="box" x="330" y="620" width="280" height="64" rx="10" fill="#E8F5E9" stroke="#66A35C"/>
  <text class="name" x="470" y="646">report.py</text>
  <text class="desc" x="470" y="668">Jinja2 渲染,git push 用 Deploy Key</text>

  <!-- 8. GitHub test-reports 仓库 -->
  <rect class="box" x="330" y="716" width="280" height="68" rx="10" fill="#F2F2F2" stroke="#9A9A9A"/>
  <text class="name" x="470" y="742">GitHub test-reports 仓库</text>
  <text class="desc" x="470" y="764">Quality Dashboard 静态读取展示</text>

  <!-- observability.py (左侧并列旁注，无箭头) -->
  <rect class="box" x="60" y="300" width="180" height="216" rx="10" fill="#FFF7D6" stroke="#D9A441"/>
  <text class="name" x="150" y="330">observability.py</text>
  <text class="desc" x="150" y="378">全程收集</text>
  <text class="desc" x="150" y="400">日志和 metrics</text>
  <text class="desc" x="150" y="434">打 snapshot</text>
  <text class="desc" x="150" y="468">故障期间</text>
  <text class="desc" x="150" y="490">只记录不判断</text>

  <!-- Legend -->
  <rect x="100" y="850" width="14" height="14" rx="3" fill="#E0DBF7" stroke="#7E6FCF" stroke-width="1.2"/>
  <text class="leg" x="150" y="862">Hermes 自带</text>

  <rect x="320" y="850" width="14" height="14" rx="3" fill="#FFF7D6" stroke="#D9A441" stroke-width="1.2"/>
  <text class="leg" x="380" y="862">我们写的 Tool</text>

  <rect x="560" y="850" width="14" height="14" rx="3" fill="#E8F5E9" stroke="#66A35C" stroke-width="1.2"/>
  <text class="leg" x="620" y="862">外部数据层</text>
</svg>
