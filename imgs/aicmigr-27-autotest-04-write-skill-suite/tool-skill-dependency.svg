<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <style>
      .tool-box {
        fill: #f5e6d3;
        stroke: #8b4513;
        stroke-width: 2;
        rx: 10;
      }
      .skill-box {
        fill: #e6e6fa;
        stroke: #4b0082;
        stroke-width: 2;
        rx: 10;
      }
      .arrow {
        stroke: #666;
        stroke-width: 2;
        fill: none;
      }
      .text {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        fill: #8b4513;
      }
      .title {
        font-weight: bold;
        font-size: 16px;
      }
      .subtitle {
        font-size: 12px;
        fill: #8b4513;
      }
      .legend-text {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
        fill: #333;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="700" fill="#ffffff"/>

  <!-- Tool 1: cluster.py -->
  <rect class="tool-box" x="300" y="30" width="200" height="80"/>
  <text class="text" x="400" y="50" text-anchor="middle">第 1 个</text>
  <text class="text title" x="400" y="70" text-anchor="middle">cluster.py</text>
  <text class="text subtitle" x="400" y="90" text-anchor="middle">集群启停,所有人的基础</text>

  <!-- Tool 2: observability.py -->
  <rect class="tool-box" x="50" y="180" width="200" height="80"/>
  <text class="text" x="150" y="200" text-anchor="middle">第 2 个</text>
  <text class="text title" x="150" y="220" text-anchor="middle">observability.py</text>
  <text class="text subtitle" x="150" y="240" text-anchor="middle">从集群拿日志和 metrics</text>

  <!-- Tool 3: client.py -->
  <rect class="tool-box" x="300" y="180" width="200" height="80"/>
  <text class="text" x="400" y="200" text-anchor="middle">第 3 个</text>
  <text class="text title" x="400" y="220" text-anchor="middle">client.py</text>
  <text class="text subtitle" x="400" y="240" text-anchor="middle">连集群跑 SDK 测试</text>

  <!-- Tool 4: chaos.py -->
  <rect class="tool-box" x="550" y="180" width="200" height="80"/>
  <text class="text" x="650" y="200" text-anchor="middle">第 4 个</text>
  <text class="text title" x="650" y="220" text-anchor="middle">chaos.py</text>
  <text class="text subtitle" x="650" y="240" text-anchor="middle">注入故障</text>

  <!-- Tool 5: report.py -->
  <rect class="tool-box" x="300" y="330" width="200" height="80"/>
  <text class="text" x="400" y="350" text-anchor="middle">第 5 个</text>
  <text class="text title" x="400" y="370" text-anchor="middle">report.py</text>
  <text class="text subtitle" x="400" y="390" text-anchor="middle">整合所有人的结果,git push</text>

  <!-- Skill: SKILL.md -->
  <rect class="skill-box" x="250" y="480" width="300" height="80"/>
  <text class="text" x="400" y="500" text-anchor="middle">第 6 个,反直觉</text>
  <text class="text title" x="400" y="520" text-anchor="middle">SKILL.md</text>
  <text class="text subtitle" x="400" y="540" text-anchor="middle">Tool 接口定下来,说明书才能写</text>

  <!-- Arrows -->
  <path class="arrow" d="M 350 110 L 200 180" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 400 110 L 400 180" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 450 110 L 600 180" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 250 260 L 350 330" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 400 260 L 400 330" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 550 260 L 450 330" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 400 410 L 400 480" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect class="tool-box" x="50" y="620" width="120" height="30"/>
  <text class="legend-text" x="110" y="640" text-anchor="middle">5 个 Tool</text>

  <rect class="skill-box" x="200" y="620" width="120" height="30"/>
  <text class="legend-text" x="260" y="640" text-anchor="middle">Skill 说明书</text>

  <text class="legend-text" x="345" y="640" text-anchor="start">依赖在先,被依赖在后;Tool 在先,Skill 在后</text>
</svg>
